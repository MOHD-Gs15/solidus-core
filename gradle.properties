# ──────────────────────────────────────────────────────────
# Solidus - Gradle Properties
# Minecraft 26.3 | Unobfuscated | Mojang Official Mappings
# ──────────────────────────────────────────────────────────

# Mod
# 2.4.0 — FAMILY BUMP (WS-1): Minecraft 26.1.2 -> 26.3. A Minecraft
# upgrade changes `minecraft_dep` for every mod in the ecosystem, so
# per VERSIONING.md this is a lockstep family release, not a patch:
# Analytics / Governance / Enforcer move to 2.4.0 together with floors
# `>=2.4.0 <3.0.0`. Code side: Family A (colored Items/Blocks constants,
# removed in 26.3) is now resolved by registry id via com.solidus.compat.
# Palette; Family B (Player#drop reshaped into
# ServerPlayer#drop(ItemStack, boolean, Prediction)) is wrapped by
# com.solidus.compat.CompatDrop with a dual-strategy MethodHandle that
# keeps the 26.1.2 backward probe green.
mod_version = 2.4.0
maven_group = com.solidus
archives_base_name = solidus

# Minecraft & Fabric (26.3 — unobfuscated, no Yarn mappings)
# minecraft_dep is the fabric.mod.json dependency expression; the pinned
# default keeps the release contract, and the CI compat-matrix workflow
# overrides it per probed version (see .github/workflows/compat-matrix.yml).
minecraft_dep = ~26.3

# loader/fabric_api aligned with Solidus Analytics & Governance (0.20.1 /
# 0.165.0+26.3): one shared Fabric API minor across the ecosystem removes
# hook/networking behavioral drift between modules that ship together.
# loader 0.20.1 resolves for 26.3 AND 26.1.2 (meta.fabricmc.net), keeping
# the 26.1.2 backward probe on the same toolchain.
minecraft_version = 26.3
loader_version = 0.20.1
loom_version = 1.16-SNAPSHOT
fabric_api_version = 0.165.0+26.3

# Java
java_version = 25
