# ──────────────────────────────────────────────────────────
# Solidus - Gradle Properties
# Minecraft 26.1.x | Unobfuscated | Mojang Official Mappings
# ──────────────────────────────────────────────────────────

# Mod
# 2.3.0 — family bump: compat/adapter layer (audit W-3), solidus-api contract
# jar + loader-enforced family dependency (audit W-5). See VERSIONING.md.
mod_version = 2.3.0
maven_group = com.solidus
archives_base_name = solidus

# Minecraft & Fabric (26.1.x — unobfuscated, no Yarn mappings)
# minecraft_dep is the fabric.mod.json dependency expression; the pinned
# default keeps the release contract, and the CI compat-matrix workflow
# overrides it per probed version (see .github/workflows/compat-matrix.yml).
minecraft_dep = ~26.1.2

# loader/fabric_api aligned with Solidus Analytics & Governance (0.19.4 /
# 0.155.2+26.1.2): one shared Fabric API minor across the ecosystem removes
# hook/networking behavioral drift between modules that ship together.
minecraft_version = 26.1.2
loader_version = 0.19.4
loom_version = 1.16-SNAPSHOT
fabric_api_version = 0.155.2+26.1.2

# Java
java_version = 25
