# ─────────────────────────────────────────────────────────────────────────────
# Solidus WS-0 / Task A — LIVE BOOT drill.
#
# The game layer had never been booted in the project's history (462 JVM-only
# tests with fakes) and the audit trail shows what that hides (W-2, W-3,
# silently-skipping packaging smoke). This workflow boots a REAL Fabric server
# for the pinned Minecraft 26.3 (the 2.4.0 family release target — WS-1), drives
# the economy through the RCON admin
# harness (production code paths, no client), restarts it, and verifies the
# funded escrow survives (ESC-01) — the exact TASK_A_LIVE_BOOT.md أ-3..أ-5
# script, automated. Versions MUST track gradle.properties (mod_version /
# minecraft_version / loader_version / fabric_api_version): the 2.4.0 jar
# correctly REFUSES older environments (fabric.mod.json floors), so a drill
# pinned to a stale MC/loader pair tests the refusal — not the game layer.
#
# Reuses scripts/live-boot/* so CI and local drills share ONE source of truth.
# ─────────────────────────────────────────────────────────────────────────────
name: live-boot

on:
  workflow_dispatch:
  push:
    branches: ["main", "ws0-live-boot"]
  pull_request:
    branches: ["main"]

concurrency:
  group: live-boot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MC_VERSION: "26.3"
      # Official 26.3 server jar (piston-data URL embeds its sha1) — matches
      # gradle.properties minecraft_version=26.3 (the 2.4.0 family target).
      SERVER_JAR_URL: "https://piston-data.mojang.com/v1/objects/33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c/server.jar"
      FABRIC_API_URL: "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.165.0+26.3/fabric-api-0.165.0+26.3.jar"
      FABRIC_INSTALLER_URL: "https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.1.2/fabric-installer-1.1.2.jar"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle (cache wrappers + dependencies)
        uses: gradle/actions/setup-gradle@v4

      - name: Build shaded jar + run the JVM suite
        run: ./gradlew build --no-daemon -Dorg.gradle.jvmargs="-Xmx2G"

      - name: Verify the shaded jar nests solidus-api (W-5 family contract)
        run: |
          test -f build/libs/solidus-*.jar
          unzip -l build/libs/solidus-*.jar | grep -q "META-INF/jars/solidus-api-.*\.jar" \
            || { echo "::error::nested solidus-api jar missing from the shipped artifact"; exit 1; }

      - name: Restore live-server artifacts cache
        uses: actions/cache@v4
        with:
          path: run-live-cache
          key: live-server-${{ env.MC_VERSION }}-v1

      - name: Prepare a real Fabric server (أ-2)
        run: |
          mkdir -p run-live/mods run-live-cache
          cd run-live
          # vanilla server (sha1-pinned by the URL) + Fabric API + installer
          [ -f ../run-live-cache/server.jar ]   || curl --retry 3 -fsSL -o ../run-live-cache/server.jar     "$SERVER_JAR_URL"
          [ -f ../run-live-cache/fabric-api.jar ] || curl --retry 3 -fsSL -o ../run-live-cache/fabric-api.jar "$FABRIC_API_URL"
          [ -f ../run-live-cache/fabric-installer.jar ] || curl --retry 3 -fsSL -o ../run-live-cache/fabric-installer.jar "$FABRIC_INSTALLER_URL"
          cp ../run-live-cache/server.jar server.jar
          cp ../run-live-cache/fabric-api.jar mods/fabric-api.jar
          java -jar ../run-live-cache/fabric-installer.jar server -mc "$MC_VERSION" -loader 0.20.1 -downloadMinecraft \
            || echo "::warning::installer re-download path — verifying launch jar exists"
          test -f fabric-server-launch.jar
          # the installer re-downloads the LATEST server jar — restore the pinned 26.3 one
          cp ../run-live-cache/server.jar server.jar
          cp ../build/libs/solidus-*.jar mods/
          echo "eula=true" > eula.txt
          cat > server.properties <<'PROPS'
          online-mode=false
          enable-rcon=true
          rcon.port=25575
          rcon.password=solidus-test
          level-type=minecraft\:flat
          max-players=20
          sync-chunk-writes=false
          PROPS

      - name: Boot #1 + RCON economy scenario (أ-3 + أ-4)
        timeout-minutes: 12
        run: bash scripts/live-boot/boot_and_drive.sh run-live boot1

      - name: Boot #2 — ESC-01 escrow survival (أ-5)
        timeout-minutes: 12
        run: bash scripts/live-boot/boot_and_drive.sh run-live boot2

      - name: Boot-log hygiene (no ERROR / CRITICAL / degradation)
        if: always()
        run: bash scripts/live-boot/boot_and_drive.sh run-live logcheck

      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-boot-logs
          path: |
            run-live/boot.log
            run-live/logs/latest.log
          if-no-files-found: ignore
          retention-days: 14
