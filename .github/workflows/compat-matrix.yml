# ─────────────────────────────────────────────────────────────
# Compatibility probe (audit W-3 / audit recommendation P0-3)
#
# Answers ONE question before players hit it: "does Solidus still
# compile against the Minecraft versions it claims to support?"
#
# Matrix (since the 2.4.0 family / WS-1):
#   - The pinned release version (26.3) is REQUIRED to pass
#     (continue-on-error: false — same contract as test.yml).
#   - 26.1.2 is a BACKWARD probe (informative): Family A is registry-id
#     keyed and Family B resolves its drop shape reflectively, so the
#     green back-probe is nearly free and is the compat-matrix safety net.
#   - 26.2 (backward) and 26.4 (forward) are PROBES: failures are
#     reported but do not block the release. The goal is early signal
#     of exactly which internals churned, so the update checklist
#     (compat/PACKAGE.md) starts from a failing diff instead of a
#     player's crash report.
#
# Fabric API version is resolved dynamically from the Fabric
# maven metadata (latest build for the target MC version) so the
# matrix never goes stale.
# ─────────────────────────────────────────────────────────────
name: compat-matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mc-versions:
        description: 'Comma-separated Minecraft versions to probe (overrides the default matrix)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  probe:
    name: MC ${{ matrix.mc }} compatibility probe
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.required == 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # WS-1: the pinned, contractually-supported release target.
          # 26.3 is REQUIRED since the 2.4.0 family upgrade — failures
          # block (continue-on-error: false, same contract as test.yml).
          - mc: "26.3"
            fabric_api: "0.165.0+26.3"
            mc_dep: "~26.3"
            required: "true"
          # Backward probe (26.1.2): must stay green via the dual-strategy
          # CompatDrop (THREE_ARG_PREDICTION on 26.3 / TWO_ARG on 26.1.x)
          # and the version-free Palette. Informative, not a gate.
          - mc: "26.1.2"
            fabric_api: "0.155.2+26.1.2"
            mc_dep: "~26.1.2"
            required: "false"
          # Backward/informative probe: expected green now that Family A is
          # registry-id keyed and Family B is reflection-resolved. A failure
          # here is a valuable early signal, not a release blocker.
          - mc: "26.2"
            fabric_api: "resolve"
            mc_dep: "~26.2"
            required: "false"
          # Future probe: Fabric API builds for 26.4 already exist
          # (0.165.1+26.4 and later). Informative, not a gate.
          - mc: "26.4"
            fabric_api: "resolve"
            mc_dep: "~26.4"
            required: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (SA2-027)

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1 (SA2-027)
        with:
          distribution: temurin
          java-version: 25

      - name: Resolve latest Fabric API for MC ${{ matrix.mc }}
        if: matrix.fabric_api == 'resolve'
        run: |
          set -euo pipefail
          echo "Fetching Fabric maven metadata..."
          METADATA=$(curl -fsSL "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml")
          # Fabric API builds carry the MC version in the artifact string
          # (e.g. 0.155.2+26.1.2). Pick the highest build for the target MC.
          LATEST=$(printf '%s' "$METADATA" \
            | grep -o '<version>[^<]*+${{ matrix.mc }}[^<]*</version>' \
            | sed 's/<[^>]*>//g' \
            | sort -V \
            | tail -n 1 || true)
          if [ -z "$LATEST" ]; then
            echo "::warning::No Fabric API build found for MC ${{ matrix.mc }} yet — this probe cannot compile. If the MC version exists, publish or pin the fabric_api_version manually."
            exit 1
          fi
          echo "Resolved Fabric API: $LATEST"
          echo "RESOLVED_FABRIC_API=$LATEST" >> "$GITHUB_ENV"

      - name: Determine Fabric API version
        id: fabapi
        run: |
          if [ "${{ matrix.fabric_api }}" = "resolve" ]; then
            echo "version=$RESOLVED_FABRIC_API" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ matrix.fabric_api }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile against MC ${{ matrix.mc }}
        run: |
          set -euo pipefail
          echo "Probing: MC ${{ matrix.mc }} / Fabric API ${{ steps.fabapi.outputs.version }} / dep ${{ matrix.mc_dep }}"
          ./gradlew compileJava compileTestJava --console=plain --no-daemon \
            -Pminecraft_version=${{ matrix.mc }} \
            -Pfabric_api_version=${{ steps.fabapi.outputs.version }} \
            -Pminecraft_dep=${{ matrix.mc_dep }}

      - name: Report probe outcome
        if: always()
        run: |
          if [ "${{ matrix.required }}" = "true" ]; then
            echo "### ✅ Pinned target MC ${{ matrix.mc }}: required build PASSED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ℹ️ Forward probe MC ${{ matrix.mc }}: $( [ '${{ job.status }}' = 'success' ] && echo 'COMPILES — candidate for support' || echo 'BROKEN — see compat/PACKAGE.md checklist' )" >> "$GITHUB_STEP_SUMMARY"
          fi
