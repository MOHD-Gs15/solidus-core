name: Tests

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Real service containers for the DB-scaling network tests (2.2.0+):
    # the 27 self-skipping MySQL/MariaDB + Redis tests activate when the
    # SOLIDUS_TEST_* variables are set, and then run against THESE services.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: solidus_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # Activates: MySqlStorageContractTest, MySqlTransferRaceTest (two
      # instances, 200 concurrent transfers), MySqlOperationsIdempotencyTest,
      # MySqlAuctionDialectTest, StorageMigratorTest (throwaway database —
      # root is required for CREATE/DROP DATABASE).
      SOLIDUS_TEST_MYSQL_HOST: 127.0.0.1
      SOLIDUS_TEST_MYSQL_PORT: 3306
      SOLIDUS_TEST_MYSQL_DATABASE: solidus_test
      SOLIDUS_TEST_MYSQL_USER: root
      SOLIDUS_TEST_MYSQL_PASSWORD: rootpass
      # Activates: RedisLayerTest (L2 cache, invalidation bus, circuit breaker).
      SOLIDUS_TEST_REDIS_URI: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run tests
        run: ./gradlew test

      - name: Coverage report (opt-in, non-blocking)
        run: ./gradlew testWithCoverage
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: jacoco-report
          path: build/reports/jacoco/

      - name: SpotBugs (non-blocking during the Java 25 toolchain shakeout)
        run: ./gradlew spotbugsMain
        continue-on-error: true

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/reports/tests/
