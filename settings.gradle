pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

// Enable auto-download of JDK toolchains via Foojay.
// When the user runs `./gradlew build`, Gradle will automatically download
// the correct JDK (Temurin 25) if it is not already installed.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'solidus'
